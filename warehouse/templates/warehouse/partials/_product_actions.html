<div class="btn-list flex-nowrap justify-content-end">
  
  <button type="button" class="btn btn-sm btn-success btn-icon"
          title="Приход" aria-label="Приход"
          data-bs-toggle="modal" data-bs-target="#movement-modal"
          data-move-id="{{ product.pk }}"
          data-move-name="{{ product.name }}"
          data-move-unit="{{ product.get_unit_display }}"
          data-move-type="in">
    <i class="ti ti-plus"></i>
  </button>

  <button type="button" class="btn btn-sm btn-danger btn-icon"
          title="Расход" aria-label="Расход"
          data-bs-toggle="modal" data-bs-target="#movement-modal"
          data-move-id="{{ product.pk }}"
          data-move-name="{{ product.name }}"
          data-move-unit="{{ product.get_unit_display }}"
          data-move-type="out">
    <i class="ti ti-minus"></i>
  </button>

  <button type="button" class="btn btn-sm btn-ghost-secondary btn-icon"
          title="В архив" aria-label="В архив"
          data-action="archive"
          data-name="{{ product.name }}">
    <i class="ti ti-archive"></i>
  </button>

</div>
